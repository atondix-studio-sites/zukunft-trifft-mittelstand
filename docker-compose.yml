services:
  web:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      SITE_URL: ${SITE_URL:-http://localhost:3000}
      ATONDIX_STUDIO_SITE_TOKEN: ${ATONDIX_STUDIO_SITE_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
